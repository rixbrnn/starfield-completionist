<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Completionist</title>
  <link rel="stylesheet" href="style.css">
  <!-- Provided by OSF UI in game; absent when the page is previewed in a browser. -->
  <script src="/shared/osfui.js"></script>
  <script src="data.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <button class="rail-back" id="back" aria-label="Close"><span class="chev left"></span></button>
      <span class="rail-label">COMPLETIONIST · MISSION TRACKER</span>
    </aside>
    <header class="top">
      <nav class="views" id="tabs" aria-label="Completionist views"></nav>
      <div class="totals" id="totals"></div>
    </header>
    <section class="side" id="side"></section>
    <section class="detail" id="detail"></section>
    <footer class="keys" id="keys"></footer>
  </div>
</body>
</html>
